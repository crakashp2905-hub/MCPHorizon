name: tests
on: [push, pull_request]
jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 scripts/validate_plan.py
      - run: python3 scripts/gen_schemas.py --check
      - run: python3 -m unittest discover -s tests/p1 -p "test_p1.py" -v
      - run: python3 -m unittest discover -s tests/p2 -p "test_core.py" -v
      - run: python3 -m unittest discover -s tests/p3 -p "test_service.py" -v
      - run: python3 -W ignore -m unittest discover -s tests/p4 -p "test_mcp_adapter.py" -v
      - run: python3 -W ignore -m unittest discover -s tests/p5 -p "test_utcp_adapter.py" -v
      - run: python3 -W ignore -m unittest discover -s tests/p7 -p "test_lineage.py" -v
      - run: python3 -m unittest discover -s tests/spec -p 'test_plan.py' -v
      - run: python3 -m unittest discover -s tests/supervisor -p 'test_supervisor.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_recovery.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_cli_verifier.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_packets2.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_verifier2.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_threatbench.py' -v
  codemode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd codemode && npm ci
      - run: python3 -W ignore -m unittest discover -s tests/p6 -p "test_codemode.py" -v
      - run: python3 bench/secbench/freeze.py verify
      - run: python3 -W ignore -m unittest tests.p8.test_secbench -v
      - run: python3 -W ignore -m unittest tests.p9.test_study tests.p9.test_stats tests.p3.test_audit_close -v
      - run: python3 bench/p9/manifest.py verify
      - run: python3 -W ignore -m unittest tests.p10.test_ops tests.p10.test_negative -v
      - run: pip install 'cryptography==50.0.1'
      - run: python3 -W ignore -m unittest tests.p13.test_authz -v
      - run: python3 -W ignore -m unittest tests.p14.test_equiv -v
      - run: python3 bench/p14/parity_gate.py
      - run: python3 -W ignore -m unittest tests.p15.test_deleg -v
      - run: python3 -W ignore -m unittest tests.p16.test_epist -v
      - run: python3 -W ignore -m unittest tests.p11.test_paper -v
      - run: python3 paper/build.py --check
      - run: python3 scripts/secret_scan.py
      - run: python3 scripts/sbom.py --out sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json
  cross-language-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/gen_schemas.py --check
      - run: cd conformance/ts && npm install --ignore-scripts --package-lock-only && cd ../.. && ./scripts/run_conformance.sh
  ts-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/run_ts_sdk_smoke.sh
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/ci_core.py
