name: tests
on: [push, pull_request]
jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python3 scripts/validate_plan.py
      - run: python3 scripts/gen_schemas.py --check
      - run: python3 -m unittest discover -s tests/p1 -p "test_p1.py" -v
      - run: python3 -m unittest discover -s tests/p2 -p "test_core.py" -v
      - run: python3 -m unittest discover -s tests/p3 -p "test_service.py" -v
      - run: python3 -W ignore -m unittest discover -s tests/p4 -p "test_mcp_adapter.py" -v
      - run: python3 -W ignore -m unittest discover -s tests/p5 -p "test_utcp_adapter.py" -v
      - run: python3 -W ignore -m unittest discover -s tests/p7 -p "test_lineage.py" -v
      - run: python3 -m unittest discover -s tests/spec -p 'test_plan.py' -v
      - run: python3 -m unittest discover -s tests/supervisor -p 'test_supervisor.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_recovery.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_cli_verifier.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_packets2.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_verifier2.py' -v
      - run: python3 -W ignore -m unittest discover -s tests/supervisor -p 'test_threatbench.py' -v
  codemode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cd codemode && npm ci
      - run: python3 -W ignore -m unittest discover -s tests/p6 -p "test_codemode.py" -v
      - run: python3 bench/secbench/freeze.py verify
      - run: python3 -W ignore -m unittest tests.p8.test_secbench -v
      - run: python3 -W ignore -m unittest tests.p9.test_study tests.p9.test_stats tests.p3.test_audit_close -v
      - run: python3 bench/p9/manifest.py verify
      - run: python3 -W ignore -m unittest tests.p10.test_ops tests.p10.test_negative -v
      - run: pip install 'cryptography==50.0.1'
      - run: python3 -W ignore -m unittest tests.p13.test_authz -v
      - run: python3 -W ignore -m unittest tests.p14.test_equiv -v
      - run: python3 bench/p14/parity_gate.py
      - run: python3 -W ignore -m unittest tests.p15.test_deleg -v
      - run: python3 -W ignore -m unittest tests.p16.test_epist -v
      - run: python3 -W ignore -m unittest tests.p17.test_txn -v
      - run: python3 -W ignore -m unittest tests.p18.test_memory -v
      - run: python3 -W ignore -m unittest tests.p19.test_attest -v
      - run: python3 -W ignore -m unittest tests.p20.test_lp -v
      - run: python3 -W ignore -m unittest tests.p21.test_arena -v
      - run: python3 -W ignore -m unittest tests.p22.test_select -v
      - run: python3 -W ignore -m unittest tests.p23.test_p23 -v
      - run: python3 scripts/runtime_gap_report.py --check
      - run: sudo -E env "PATH=$PATH" python3 scripts/p38_runner_check.py --require      # fail loudly if the kernel-isolation tests cannot run on this runner
      # Runtime tests need root (namespaces/Landlock/seccomp). They skip with a visible UNSUPPORTED message otherwise; the `-v` output records which.
      - run: sudo -E env "PATH=$PATH" python3 -W ignore -m unittest tests.p24.test_sandbox tests.p25.test_broker tests.p26.test_creds tests.p27.test_managed -v
      - run: pip install bandit==1.9.4
      - run: sudo -E env "PATH=$PATH" python3 -W ignore -m unittest tests.p28.test_artifacts -v
      - run: sudo -E env "PATH=$PATH" python3 scripts/security_gate.py
      - run: python3 scripts/runtime_creds_report.py --check
      - run: sudo -E env "PATH=$PATH" python3 -W ignore -m unittest tests.p29.test_haa tests.p30.test_p30 -v
      - run: python3 bench/haa/aggregate.py results/v2/haa-main --check
      - run: python3 bench/haa/report.py --check
      - run: python3 scripts/hr_gates.py --check
      - run: python3 scripts/p30_no_external.py
      - run: python3 scripts/p30_claims_audit.py
      - run: pip install pyyaml==6.0.3
      - run: python3 -W ignore -m unittest tests.p31.test_intake tests.p32.test_triggerlab tests.p36.test_guard -v
      - run: sudo -E env "PATH=$PATH" python3 -W ignore -m unittest tests.p33.test_hccb tests.p34.test_isolation tests.p35.test_telemetry -v
      - run: python3 scripts/p31_inventory.py --check
      - run: sudo -E env "PATH=$PATH" python3 -W ignore -m unittest tests.p37.test_h4 -v
      - run: python3 bench/h4/run.py check
      - run: python3 bench/h4/report.py --check
      - run: pip install pyyaml==6.0.3 && sudo -E env "PATH=$PATH" python3 -W ignore -m unittest tests.p38.test_p38 -v
      - run: python3 -W ignore -m unittest tests.p39.test_emergence -v && python3 scripts/p39_report.py --check && python3 scripts/p39_run.py --check
      - run: python3 scripts/p39_mutants.py          # every mutant must be killed
      - run: python3 -W ignore -m unittest tests.p40.test_obligation -v && python3 scripts/p40_report.py --check && python3 scripts/p40_run.py --check
      - run: python3 scripts/p40_mutants.py          # every mutant must be killed
      - run: python3 -W ignore -m unittest tests.p41.test_counterfactual -v && python3 scripts/p41_report.py --check && python3 scripts/p41_run.py --check
      - run: python3 scripts/p41_mutants.py          # every mutant must be killed
      - run: sudo -E env "PATH=$PATH" python3 -W ignore -m unittest tests.p42.test_coverage -v      # live sandbox sink tests need root
      - run: python3 scripts/p42_report.py --check && python3 scripts/p42_run.py --check
      - run: python3 scripts/p42_mutants.py          # every mutant must be killed
      - run: sudo -E env "PATH=$PATH" python3 scripts/p42_release_gate.py      # supported protection claims need live VERIFIED coverage now
      - run: python3 -W ignore -m unittest tests.p43.test_mutation -v && python3 scripts/p43_report.py --check && python3 scripts/p43_run.py --check
      - run: python3 scripts/p43_mutants.py          # every mutant must be killed
      - run: python3 -W ignore -m unittest tests.p44.test_reach -v && python3 scripts/p44_report.py --check && python3 scripts/p44_run.py --check
      - run: python3 scripts/p44_mutants.py          # every mutant must be killed
      - run: python3 -W ignore -m unittest tests.p45.test_privacy -v && python3 scripts/p45_report.py --check && python3 scripts/p45_run.py --check && python3 scripts/p45_repeat.py
      - run: python3 scripts/p45_mutants.py          # every mutant must be killed
      - run: python3 -W ignore -m unittest tests.p46.test_downgrade -v && python3 scripts/p46_report.py --check && python3 scripts/p46_run.py --check
      - run: python3 scripts/p46_mutants.py          # every mutant must be killed
      - run: python3 scripts/p38_casebook.py --check && python3 scripts/p38_compare.py --check && python3 scripts/p38_papers.py --check && python3 scripts/p38_gates.py --check
      - run: python3 -W ignore -m unittest tests.p11.test_paper -v
      - run: python3 paper/build.py --check
      - run: python3 scripts/secret_scan.py
      - run: python3 scripts/sbom.py --out sbom.cdx.json
      - run: python3 scripts/p38_release_bundle.py build release-evidence.tar && python3 scripts/p38_release_bundle.py verify release-evidence.tar      # ephemeral-key bundle: integrity only, not identity or independent review
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-and-evidence
          path: |
            sbom.cdx.json
            release-evidence.tar
  cross-language-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/gen_schemas.py --check
      - run: cd conformance/ts && npm install --ignore-scripts --package-lock-only && cd ../.. && ./scripts/run_conformance.sh
  ts-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: ./scripts/run_ts_sdk_smoke.sh
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 scripts/ci_core.py
